  <line x1="116" y1="112" x2="124" y2="112" stroke="#64748b" stroke-width="2"/>
  <line x1="88" y1="110" x2="94" y2="110" stroke="#64748b" stroke-width="2"/>
  <line x1="146" y1="110" x2="152" y2="110" stroke="#64748b" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="105" cy="112" r="2.5" fill="#1e293b"/>
